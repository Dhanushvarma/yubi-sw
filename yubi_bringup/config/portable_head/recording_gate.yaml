# Portable, head-worn — overlay onto common/recording_gate.yaml
# Head camera conditions as in portable/recording_gate.yaml (keep in sync),
# plus body tracking: a start needs high-fidelity, calibrated body data from
# Inside-Out Body Tracking (IOBT), and an episode is cancelled if body data
# stops for 3 s.

groups:
  health:
    conditions:
      # Head camera (USB): topic stopped → warn at 1s, stop at 3s
      head_camera_timeout_warn:
        topic: /center_camera/camera_info
        timeout_sec: 1.0
        escalation: 1

      head_camera_timeout_stop:
        topic: /center_camera/camera_info
        timeout_sec: 3.0
        escalation: 2

      # Head camera: < 30 Hz → warning (BLOCK_START), < 15 Hz → stop (HARD_STOP)
      head_camera_warn:
        topic: /center_camera/camera_info
        timeout_sec: 3.0
        min_rate_hz: 30.0
        rate_window_sec: 5.0
        rate_escalation: 1
        debounce_sec: 0.5
        reason: "Center (USB) camera frame rate below 30 Hz ({detail})"

      head_camera_stop:
        topic: /center_camera/camera_info
        timeout_sec: 3.0
        min_rate_hz: 15.0
        rate_window_sec: 5.0
        rate_escalation: 2
        debounce_sec: 0.5
        reason: "Center (USB) camera frame rate below 15 Hz ({detail})"

  # ---------------------------------------------------------------------------
  # Body tracking — /quest/body/fidelity and /quest/body/calibration
  # (std_msgs/UInt8, reliable mirrors of QuestBody.fidelity and
  # QuestBody.calibration_status, published with every pose sample that has
  # body data)
  # ---------------------------------------------------------------------------
  body_tracking:
    recovery_sec: 0.5
    default_type: topic_condition
    conditions:

      # No body data → warn (BLOCK_START) at 1s, stop (HARD_STOP) at 3s
      body_tracking_timeout_warn:
        topic: /quest/body/fidelity
        timeout_sec: 1.0
        escalation: 1

      body_tracking_timeout_stop:
        topic: /quest/body/fidelity
        timeout_sec: 3.0
        escalation: 2

      # Low fidelity means the arms are inferred from the head and controllers
      # only (no camera-based IOBT) → warn (BLOCK_START)
      body_tracking_fidelity_warn:
        topic: /quest/body/fidelity
        condition: "msg.data == 2"
        timeout_sec: 1.0
        escalation: 1
        debounce_sec: 0.5
        reason: "Body tracking is low fidelity; IOBT is not tracking the arms"

      # IOBT calibrates the body for about 10-15 s after the headset goes on
      # (calibration_status 2); arm lengths and wrists are wrong until it
      # reports 1 (valid) → warn (BLOCK_START), so takes start calibrated.
      body_tracking_calibration_warn:
        topic: /quest/body/calibration
        condition: "msg.data == 1"
        timeout_sec: 1.0
        escalation: 1
        debounce_sec: 0.5
        reason: "Body tracking is still calibrating; wait about 15 s after putting the headset on"
