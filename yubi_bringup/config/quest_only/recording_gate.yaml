# Quest-only — overlay onto common/recording_gate.yaml
# There are no hand cameras, so their common conditions are dropped. The
# gripper joint_state checks stay (with a Wi-Fi-tolerant timeout):
# trigger_gripper_node publishes them at 100 Hz from the analog triggers.
# The head camera is the Quest passthrough
# camera (quest_camera_node), which runs at up to 30 fps, so its rate
# thresholds are below the portable USB camera's 30/15 Hz.
#
# With the stock v0.1.0 APK (no camera stream, no analog triggers) these
# checks never pass. To bench-test with it, drop them locally in
# config/local/recording_gate.yaml:
#
#   groups:
#     health: "__delete__"

groups:
  health:
    conditions:
      left_camera_timeout_warn: "__delete__"
      left_camera_timeout_stop: "__delete__"
      right_camera_timeout_warn: "__delete__"
      right_camera_timeout_stop: "__delete__"
      left_camera_warn: "__delete__"
      left_camera_stop: "__delete__"
      right_camera_warn: "__delete__"
      right_camera_stop: "__delete__"

      # The gripper value comes from the Quest's Joy stream over Wi-Fi, not a
      # USB encoder, so allow the same 0.5s gap after which trigger_gripper_node
      # itself stops publishing (data_timeout_sec). 0.1s trips on Wi-Fi jitter.
      left_gripper_joint_state_timeout_stop:
        timeout_sec: 0.5
        reason: "Left gripper joint_state stalled (> 0.5s)"

      right_gripper_joint_state_timeout_stop:
        timeout_sec: 0.5
        reason: "Right gripper joint_state stalled (> 0.5s)"

      # Head camera: topic stopped → warn at 1s, stop at 3s
      head_camera_timeout_warn:
        topic: /center_camera/camera_info
        timeout_sec: 1.0
        escalation: 1

      head_camera_timeout_stop:
        topic: /center_camera/camera_info
        timeout_sec: 3.0
        escalation: 2

      # Head camera: < 25 Hz → warning (BLOCK_START), < 12 Hz → stop (HARD_STOP)
      head_camera_warn:
        topic: /center_camera/camera_info
        timeout_sec: 3.0
        min_rate_hz: 25.0
        rate_window_sec: 5.0
        rate_escalation: 1
        debounce_sec: 0.5
        reason: "Quest passthrough camera frame rate below 25 Hz ({detail})"

      head_camera_stop:
        topic: /center_camera/camera_info
        timeout_sec: 3.0
        min_rate_hz: 12.0
        rate_window_sec: 5.0
        rate_escalation: 2
        debounce_sec: 0.5
        reason: "Quest passthrough camera frame rate below 12 Hz ({detail})"
